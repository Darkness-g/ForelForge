<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузить игру</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a class="nav-btn" href="{{ url_for('home') }}">Главная</a>
        <a class="nav-btn" href="{{ url_for('games_page') }}">Игры</a>
        <a class="nav-btn" href="{{ url_for('community') }}">Сообщество</a>
        <a class="nav-btn" href="{{ url_for('library') }}">Библиотека</a>
        <a class="nav-btn" href="{{ url_for('profile') }}">Профиль</a>
    </div>
    <div class="nav-right">
        {% if session.get('username') %}
             <a href="{{ url_for('add_balance') }}" class="nav-add-balance">Пополнить</a>
            <span class="nav-balance">Balance: {{ user.balance }}$</span>

            <a href="{{ url_for('profile') }}" class="nav-avatar">
                <img src="{{ url_for('static', filename=session['avatar'].replace('static/', '')) }}" alt="avatar">
                <span>{{ session['username'] }}</span>
            </a>
            <a href="{{ url_for('logout') }}" class="nav-auth-btn">Выйти</a>
        {% else %}
            <a href="{{ url_for('login') }}" class="nav-auth-btn">Вход</a>
            <a href="{{ url_for('register') }}" class="nav-auth-btn">Регистрация</a>
        {% endif %}
    </div>
</div>

<div class="upload-container" style="max-width:600px; margin:120px auto; color:white;">
    <h2>Загрузить новую игру</h2>

    {% if error %}
        <p style="color:#ff5555;">{{ error }}</p>
    {% endif %}

    <form action="" method="POST" enctype="multipart/form-data">
        <label>Название игры:</label><br>
        <input type="text" name="title" required><br><br>

        <label>Описание:</label><br>
        <textarea name="description" rows="5" required></textarea><br><br>

        <label>Цена ($):</label><br>
        <input type="number" name="price" step="0.01" min="0" value="0"><br><br>

        <label>Системные требования:</label><br>
        <textarea name="system_requirements" rows="4"></textarea><br><br>

        <label>Файл игры (обязательно):</label><br>
        <input type="file" name="game_file" accept=".zip,.exe,.rar" required><br><br>

        <label>Обложка игры (опционально):</label><br>
        <input type="file" name="image_file" accept=".jpg,.jpeg,.png"><br><br>


        <button type="submit" style="padding:10px 20px; background:#ff0000; color:white; border:none; border-radius:8px;">Загрузить</button>
    </form>
</div>

</body>
</html>
