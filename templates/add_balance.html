<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Пополнение баланса</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
    body {
        background-color: #1e0000;
        color: #fff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 450px;
        margin: 100px auto;
        padding: 30px 25px;
        background: rgba(30,0,0,0.9);
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 0 20px rgba(255,75,75,0.4);
    }

    .container2 {
        max-width: 450px;
        margin: 100px auto;
        padding: 30px 25px;
        background: rgba(30,0,0,0.9);
        
        text-align: center;
        
    }
    h2 {
        margin-bottom: 25px;
        color: #ff8080;
        text-shadow: 1px 1px 5px rgba(255,0,0,0.6);
    }

    input[type=number], select {
        width: 90%;
        padding: 12px 15px;
        margin: 12px 0 20px 0;
        border-radius: 10px;
        border: 1px solid #ff4b4b;
        font-size: 16px;
        background: rgba(255,255,255,0.05);
        color: #fff;
        outline: none;
        transition: 0.2s;
    }

    input[type=number]:focus, select:focus {
        border-color: #ff1a1a;
        box-shadow: 0 0 10px rgba(255,0,0,0.5);
    }

    ::placeholder {
        color: #ffcccc;
    }

    select {
        appearance: none; 
        -webkit-appearance: none;
        -moz-appearance: none;
        background-color: rgba(255,255,255,0.05);
        color: #fff;
        padding-right: 30px; 
        cursor: pointer;
        position: relative;
    }

    select option {
        background-color: #2a0000;
        color: #fff;
        padding: 10px;
    }

    select:hover option {
        background-color: #3a0000;
    }

    button {
        width: 100%;
        padding: 12px 20px;
        background-color: #ff4b4b;
        border: none;
        border-radius: 10px;
        color: #fff;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 5px 10px rgba(255,0,0,0.4);
    }

    button:hover {
        background-color: #ff1a1a;
        box-shadow: 0 5px 15px rgba(255,0,0,0.6);
        transform: translateY(-2px);
    }

    .error {
        color: #ff9999;
        margin-bottom: 15px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Пополнить баланс</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <label>Сумма</label>
        <input type="number" name="amount" min="1" step="0.01" required placeholder="Введите сумму">

        <label>Способ оплаты</label>
        <select name="method" required>
            <option value="" disabled selected>Выберите способ оплаты</option>
            <option value="card">Банковская карта</option>
            <option value="paypal">PayPal</option>
            <option value="crypto">Криптовалюта</option>
        </select>

        <button type="submit">Пополнить</button>

    </form>
    
</div>
<div class="container2">
        <a href="javascript:history.back()" class="back-btn" style="display:inline-block; margin-bottom:15px; color:#ff4b4b; text-decoration:none; font-weight:bold; transition:0.3s;" 
        onmouseover="this.style.textShadow='0 0 10px rgba(255,75,75,0.7)'" 
        onmouseout="this.style.textShadow='none'">
        ← Назад
        </a>
    </div>


</body>
</html>
