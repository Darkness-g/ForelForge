<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ForelForge Loader</title>
<style>
    
body {
    background: #120000;
    color: #fff;
    font-family: Arial;
    text-align: center;
    padding: 20px;
}
button {
    background: #ff4b4b;
    border: none;
    padding: 10px 20px;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}



.progress-container {
    width: 100%;
    height: 20px;
    background: #330000;
    border-radius: 10px;
    margin-top: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #ff4b4b;
    transition: width 0.2s;
}


</style>
</head>
<body>

<h2>Установка игры</h2>



<div class="game">
    <h3>CS Demo</h3>
    <button onclick="download()">Установить</button>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="progressText">0%</div>
</div>

<script src="renderer.js"></script>

</body>
</html>
